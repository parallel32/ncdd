<FilesMatch "\.(flv|ico|pdf|avi|mov|ppt|doc|mp3|wmv|wav|xml|txt|html|js|css|gif|jpg|jpeg|png|swf|php|cgi|pl|htm)$">
ExpiresActive On
ExpiresDefault A0
Header set Cache-Control "private, no-cache, no-store, proxy-revalidate, no-transform"
Header set Pragma "no-cache"
</FilesMatch>

ErrorLog /var/www/ncdd/www/ncdd.com/logs/error_log
CustomLog /var/www/ncdd/www/ncdd.com/logs/access_log common
CustomLog /var/www/ncdd/www/ncdd.com/logs/agent_log agent
SetEnvIf Referer ncdd\.com INTERNAL_REFERRAL
CustomLog /var/www/ncdd/www/ncdd.com/logs/referer_log referer env=!INTERNAL_REFERRAL
ErrorDocument 404 /404.html

Include conf.d/include-constants.conf
