<VirtualHost *:80>
ServerName local.ncdd.com
ServerAdmin server@ncdd.com

DocumentRoot /var/www/saw/www/ncdd.com/public_html
<Directory /var/www/saw/www/ncdd.com/public_html>
	Order allow,deny
	Allow from all
	<IfModule mod_rewrite.c>
		Options -MultiViews
		RewriteEngine On
		## apparently the .htaccess file which used to have this favicon line was being ignored.
		RewriteRule ^favicon.ico$ assets/img/favicon.ico [NC]
		RewriteBase /
		RewriteCond %{REQUEST_FILENAME} !-f
		RewriteRule ^ index.php [L]
	</IfModule>
</Directory>
ErrorLog /var/www/saw/www/ncdd.com/logs/error_log
CustomLog /var/www/saw/www/ncdd.com/logs/access_log common
ErrorDocument 404 /404.html

Include /var/www/vhost.d/include-constants.conf
</VirtualHost>